android.useAndroidX=true
android.nonTransitiveRClass=true
android.disallowKotlinSourceSets=false
kotlin.code.style=official

# 10-24 深夜：CI 的 macOS runner 默认 daemon 堆 512MB，framework 链接那步 GC 抖死
# （日志原文 "Daemon is stopping immediately since the JVM garbage collector is thrashing"）。
# 3G 堆 + 1G metaspace 让链接走完；本机用户级 gradle.properties 另有自己的设置，互不干扰。
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8

# Strong Skipping 在 Kotlin 2.x 的 Compose 编译器里是默认开的，这里不去关它。
# 帧率真正的两笔在别处：UiState 一律标 @Immutable/@Stable，以及 release 开 R8 + Baseline Profile。
