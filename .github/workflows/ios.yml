name: ios

# 出包流水线（macOS runner，公开仓免费）。骨架第二版：
#  - 先在 CI 上链真机 framework（Windows 上 KGP 跳过的那步，在这补上证据）
#  - Xcode/模拟器那截仍是骨架，失败不会拦住 framework 产物上传

on:
  push:
    branches: [main, kmp]
  workflow_dispatch: {}

jobs:
  build:
    name: framework + 模拟器 + 无签名 ipa
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: 链真机 release framework（本机做不了的那步，在这出证据）
        run: ./gradlew :shared:linkReleaseFrameworkIosArm64 --console=plain

      - name: 预置 framework 占位（xcodegen 生成时要能找到路径；对应 flavor 由脚本相位构建时替换）
        run: |
          mkdir -p shared/build/xcodeFrameworks
          cp -R shared/build/bin/iosArm64/releaseFramework/shared.framework shared/build/xcodeFrameworks/shared.framework

      - name: 装 xcodegen / xcbeautify 并生成工程
        run: |
          brew install xcodegen xcbeautify
          cd iosApp && xcodegen -s project.yml

      - name: 模拟器构建（framework 由工程里那段 preBuildScript 按 SDK 现编现嵌）
        run: |
          set -o pipefail
          xcodebuild -project iosApp/AndaXin.xcodeproj \
            -scheme AndaXin -configuration Debug \
            -destination 'platform=iOS Simulator,name=iPhone 16' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO build \
            | xcbeautify

      - name: 模拟器装上、点亮、截屏
        run: |
          # 选机：同型号里运行时最新的那台 iPhone 16。
          # 8bcec04 那发栽在 jq 上（漏了 .devices，jq 退 5，这一步在启动 app 之前就死了）；
          # 这次不依赖 jq 也不依赖 python —— simctl list 的文本输出按运行时从旧到新分段
          # （-- iOS 18.5 -- / -- iOS 26.2 --），所以"最后一个 iPhone 16 ("就是最新那台。
          # 老写法 grep | head -1 取到的正是最旧那台，而 xcodebuild 走的是 OS:26.2。
          DEVLIST=$(xcrun simctl list devices available)
          printf '%s\n' "$DEVLIST" | grep -E '^-- |iPhone 16 \(' | tail -12 || true
          UDID=$(printf '%s\n' "$DEVLIST" | grep "iPhone 16 (" | tail -1 | sed -E 's/.*\(([A-F0-9-]+)\).*/\1/')
          RUNTIME=$(printf '%s\n' "$DEVLIST" | awk '/^-- /{r=$0} /iPhone 16 \(/{last=r} END{print last}')
          echo "选中：${RUNTIME:-运行时未知} / ${UDID:-没选到}"
          if [ -z "$UDID" ]; then echo "没有可用的 iPhone 16 模拟器，判这步失败"; exit 1; fi
          xcrun simctl boot "$UDID" || true
          APP=$(find build/Build/Products -name 'AndaXin.app' -path '*iphonesimulator*' | head -1)
          xcrun simctl install "$UDID" "$APP" || { echo "install 就失败了"; exit 1; }
          xcrun simctl get_app_container "$UDID" com.andaxin.ios data >/dev/null 2>&1 && echo "app 容器在" || echo "app 容器不在（装没装上都有问题）"
          # macOS runner 没有 GNU timeout（78750fc 那发就是 command not found，launch 根本没跑）。
          # 后台挂 console + sleep + kill：kill 的是 simctl 客户端，不动 app，
          # 所以第二张图还能顺便验"是不是我这一掐把 app 带走的"。
          xcrun simctl launch --console-pty --terminate-running-process "$UDID" com.andaxin.ios > launch-console.log 2>&1 &
          CPID=$!
          sleep 12
          xcrun simctl io "$UDID" screenshot iosApp/simulator-launch.png || true
          kill "$CPID" 2>/dev/null || true
          sleep 6
          xcrun simctl io "$UDID" screenshot iosApp/simulator-later.png || true
          echo "--- launch-console.log（app 自己吐的，最多 80 行）"
          echo "console 字节: $(wc -c < launch-console.log 2>/dev/null || echo 读不到)"
          head -80 launch-console.log 2>/dev/null || echo "console 是空的"
          # 崩溃报告两处都翻：runner 用户目录，和这台模拟器自己的数据目录
          for d in "$HOME/Library/Logs/DiagnosticReports" "$HOME/Library/Developer/CoreSimulator/Devices/$UDID/data/Library/Logs/CrashReporter"; do
            find "$d" -iname '*AndaXin*' -mmin -20 2>/dev/null | while read -r c; do
              echo "--- 崩溃报告 $c"; head -80 "$c"
            done
          done
          echo "--- 系统日志里的 AndaXin"
          xcrun simctl spawn "$UDID" log show --style compact --last 3m --predicate 'process == "AndaXin"' 2>/dev/null | tail -30 || true
          xcrun simctl spawn "$UDID" launchctl list 2>/dev/null | grep -i andaxin || echo "launchctl 里已经没有 AndaXin 进程"
          # 装进去的那份 plist 到底长什么样：xcodebuild 警告说缺启动屏，而仓库那份现在已改成由 project.yml 生成
          echo "--- 产物里的 Info.plist 关键键"
          plutil -p "$APP/Info.plist" 2>/dev/null | grep -iE "UILaunchScreen|UISupportedInterfaceOrientations|UIRequiresFullScreen|CFBundleIdentifier|MinimumOSVersion|NSExceptionDomains" || echo "读不到 $APP/Info.plist"

      - name: 无签名真机 ipa（Sideloadly/爱思在 PC 上重签用）
        run: |
          set -o pipefail
          xcodebuild -project iosApp/AndaXin.xcodeproj \
            -scheme AndaXin -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build-device CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build \
            | xcbeautify
          APP=$(find build-device/Build/Products -name 'AndaXin.app' -path '*iphoneos*' | head -1)
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry AndaXin-unsigned.ipa Payload
          unzip -l AndaXin-unsigned.ipa | head -5

      - name: 打包 framework 产物
        if: always()
        run: |
          if [ -d shared/build/bin/iosArm64/releaseFramework ]; then
            zip -qry shared-framework.zip shared/build/bin/iosArm64/releaseFramework
          else
            echo "framework 目录不存在（链接那步没过？）"
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-artifacts
          path: |
            iosApp/simulator-launch.png
            iosApp/simulator-later.png
            launch-console.log
            AndaXin-unsigned.ipa
            shared-framework.zip
          if-no-files-found: warn
