name: ios

# 出包流水线（macOS runner，公开仓免费）。骨架第二版：
#  - 先在 CI 上链真机 framework（Windows 上 KGP 跳过的那步，在这补上证据）
#  - Xcode/模拟器那截仍是骨架，失败不会拦住 framework 产物上传

on:
  push:
    branches: [main, kmp]
  workflow_dispatch: {}

jobs:
  build:
    name: framework + 模拟器 + 无签名 ipa
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: 链真机 release framework（本机做不了的那步，在这出证据）
        run: ./gradlew :shared:linkReleaseFrameworkIosArm64 --console=plain

      - name: 预置 framework 占位（xcodegen 生成时要能找到路径；对应 flavor 由脚本相位构建时替换）
        run: |
          mkdir -p shared/build/xcodeFrameworks
          cp -R shared/build/bin/iosArm64/releaseFramework/shared.framework shared/build/xcodeFrameworks/shared.framework

      - name: 装 xcodegen / xcbeautify 并生成工程
        run: |
          brew install xcodegen xcbeautify
          cd iosApp && xcodegen -s project.yml

      - name: 模拟器构建（framework 由工程里那段 preBuildScript 按 SDK 现编现嵌）
        run: |
          set -o pipefail
          xcodebuild -project iosApp/AndaXin.xcodeproj \
            -scheme AndaXin -configuration Debug \
            -destination 'platform=iOS Simulator,name=iPhone 16' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO build \
            | xcbeautify

      - name: 模拟器装上、点亮、截屏
        run: |
          xcrun simctl list devices available | grep iPhone || true
          UDID=$(xcrun simctl list devices available | grep "iPhone 16 (" | head -1 | sed -E 's/.*\(([A-F0-9-]+)\).*/\1/')
          echo "UDID=$UDID"
          xcrun simctl boot "$UDID" || true
          APP=$(find build/Build/Products -name 'AndaXin.app' -path '*iphonesimulator*' | head -1)
          xcrun simctl install "$UDID" "$APP"
          xcrun simctl launch "$UDID" com.andaxin.ios
          sleep 5
          xcrun simctl io "$UDID" screenshot simulator-launch.png

      - name: 无签名真机 ipa（Sideloadly/爱思在 PC 上重签用）
        run: |
          set -o pipefail
          xcodebuild -project iosApp/AndaXin.xcodeproj \
            -scheme AndaXin -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build-device CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build \
            | xcbeautify
          APP=$(find build-device/Build/Products -name 'AndaXin.app' -path '*iphoneos*' | head -1)
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry AndaXin-unsigned.ipa Payload
          unzip -l AndaXin-unsigned.ipa | head -5

      - name: 打包 framework 产物
        if: always()
        run: |
          if [ -d shared/build/bin/iosArm64/releaseFramework ]; then
            zip -qry shared-framework.zip shared/build/bin/iosArm64/releaseFramework
          else
            echo "framework 目录不存在（链接那步没过？）"
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-artifacts
          path: |
            iosApp/simulator-launch.png
            AndaXin-unsigned.ipa
            shared-framework.zip
          if-no-files-found: warn
