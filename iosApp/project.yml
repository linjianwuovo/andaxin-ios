# XcodeGen 的工程描述：真正的 .xcodeproj 不进仓，在 CI（或以后的 Mac）上用
# `xcodegen -s iosApp/project.yml` 现生成。骨架，第二版：Info.plist 改真文件、补 scheme、
# 脚本相位换成 Kotlin 官方那条 embedAndSign（按当前 SDK/架构自己挑 iosArm64 或模拟器目标编）。

name: AndaXin
options:
  bundleIdPrefix: com.andaxin
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

settings:
  base:
    # 无苹果开发者账号阶段：整工程不开签名，产物给 Sideloadly/爱思在 Windows 侧重签。
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGN_IDENTITY: ""

targets:
  AndaXin:
    type: application
    platform: iOS
    sources:
      - path: Sources
    info:
      path: Info.plist
      # 这些键必须写在这儿，不能只写 iosApp/Info.plist：
      # XcodeGen 的 info: 每次生成工程都会重写那个文件（文档 ProjectSpec.md：
      # "this will generate and write an Info.plist to the specified path"），
      # 手写那份在 CI 上会被盖掉 —— 8bcec04 之前那几发就是这个坑：
      # xcodebuild 一直报"缺启动屏/缺方向"，而包里也确实没有 ATS 例外（真机上体育那台明文 http 会被系统拦）。
      properties:
        CFBundleDevelopmentRegion: zh_CN
        CFBundleName: AndaXin
        CFBundleDisplayName: 安大信
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # 只给跑量那台明文 http 的服务器开例外（对齐 Android 那份 network_security_config 的口径，不开全局放行）
        NSAppTransportSecurity:
          NSExceptionDomains:
            sports.aiit.edu.cn:
              NSExceptionAllowsInsecureHTTPLoads: true
              NSIncludesSubdomains: true
    dependencies:
      # 固定路径的静态 framework：脚本相位在每次构建前按 SDK/配置把对应 flavor
      # 拷到这里替换（见 preBuildScripts），CI 在 xcodegen 之前会先放一份占位。
      - framework: ../shared/build/xcodeFrameworks/shared.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.andaxin.ios
        MARKETING_VERSION: "0.8.28"
        CURRENT_PROJECT_VERSION: "70"
    preBuildScripts:
      - name: BuildSharedFramework
        script: |
          cd "$SRCROOT/.."
          T=iosArm64
          FLAVOR=Release
          DIR=releaseFramework
          if [ "$PLATFORM_NAME" = "iphonesimulator" ]; then T=iosSimulatorArm64; fi
          if [ "$CONFIGURATION" = "Debug" ]; then FLAVOR=Debug; DIR=debugFramework; fi
          ./gradlew ":shared:link${FLAVOR}Framework${T}" || exit 1
          mkdir -p shared/build/xcodeFrameworks
          rm -rf shared/build/xcodeFrameworks/shared.framework
          cp -R "shared/build/bin/${T}/${DIR}/shared.framework" shared/build/xcodeFrameworks/shared.framework

schemes:
  AndaXin:
    build:
      targets:
        AndaXin: all
    run:
      config: Debug
    archive:
      config: Release
